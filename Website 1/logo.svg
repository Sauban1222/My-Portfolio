<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sauban Ali logo">
  <defs>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161417"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5064"/>
      <stop offset="55%" stop-color="#e8102a"/>
      <stop offset="100%" stop-color="#8c0c1a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge: rounded square with one chamfered corner (circuit-board notch) -->
  <path d="M22 6 H78 L94 22 V78 Q94 94 78 94 H22 Q6 94 6 78 V22 Q6 6 22 6 Z"
        fill="url(#badgeFill)" stroke="#3a1418" stroke-width="1.5"/>
  <path d="M22 6 H78 L94 22 V78 Q94 94 78 94 H22 Q6 94 6 78 V22 Q6 6 22 6 Z"
        fill="none" stroke="url(#strokeGrad)" stroke-width="1.2" opacity="0.55"/>

  <!-- chamfer accent line -->
  <line x1="78" y1="6" x2="94" y2="22" stroke="#ff3b4e" stroke-width="1.4" opacity="0.9"/>

  <!-- monoline S mark -->
  <path d="M67 30 C67 30 38 29 36 41 C34 53 63 46 61 58 C59 70 30 69 30 69"
        fill="none" stroke="url(#strokeGrad)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- pixel accent -->
  <rect x="14" y="80" width="6" height="6" rx="1.5" fill="#ff3b4e"/>
</svg>
